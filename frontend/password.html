<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Change Password | Juniper Hollow Weddings &amp; Events</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="top-ribbon">
    Juniper Hollow Team Portal <span>&bull;</span> Staff Access Only
  </div>

  <header class="site-header">
    <div class="nav-container">
      <a href="index.html" class="brand-logo">
        <span class="brand-title">Juniper Hollow</span>
        <span class="brand-subtitle">Weddings &amp; Events</span>
      </a>

      <div class="nav-actions">
        <a href="login.html" class="btn btn-outline">Staff Login</a>
      </div>
    </div>
  </header>

  <main class="auth-stage">
    <div class="auth-shell">
      <span class="eyebrow">Juniper Hollow Staff Portal</span>
      <h1 class="heading-md" style="font-size: 2.15rem;">Change Your Password</h1>

      <!-- STEP 1: email a 6-digit code -->
      <form id="password-code-form" novalidate>
        <p style="color: var(--ink-muted); font-size: 0.93rem; margin: 0.45rem 0 1.75rem;">
          Enter your work email and we'll send you a 6-digit code.
        </p>
        <div class="form-group">
          <label for="password-email">Work Email Address</label>
          <input type="email" id="password-email" class="form-control" autocomplete="username" maxlength="320" required />
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%;">Send Code</button>
      </form>

      <!-- STEP 2: code + new password -->
      <form id="password-reset-form" class="hidden-panel" novalidate>
        <p style="color: var(--ink-muted); font-size: 0.93rem; margin: 0.45rem 0 1.75rem;">
          Check your inbox for the 6-digit code, then choose a new password.
        </p>
        <div class="form-group">
          <label for="password-code">6-Digit Code</label>
          <input type="text" id="password-code" class="form-control" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required />
        </div>
        <div class="form-group">
          <label for="password-new">New Password</label>
          <input type="password" id="password-new" class="form-control" autocomplete="new-password" maxlength="128" required />
        </div>
        <div class="form-group">
          <label for="password-confirm">Confirm New Password</label>
          <input type="password" id="password-confirm" class="form-control" autocomplete="new-password" maxlength="128" required />
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%;">Change Password</button>
      </form>

      <div id="password-status" class="status-banner" role="status" aria-live="polite"></div>
    </div>
  </main>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
